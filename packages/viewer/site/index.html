<!doctype html>
<!-- rulecad model page: one model from the link (#m=… or a short link, #s=<gist>), with a parts panel to show, hide
     and restyle each part and tick the ones a download holds, and print files made in the browser. &get=stl or &get=3mf
     downloads every printed part as the page opens. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Model</title>
<style>
  /* Glass inks on Glass ground (github.com/JoniBach/glass), sized for a desk, not a mirror across the room */
  :root { --ground: #000; --ink-1: #fff; --ink-2: #b4b4b4; --ink-3: #5c5c5c; --line: #2a2a2a; --gap: 24px; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink-1); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; }
  body { display: grid; grid-template-rows: 1fr auto; grid-template-columns: 1fr auto; }
  #stage { position: relative; min-height: 0; cursor: grab; touch-action: none; }
  #stage:active { cursor: grabbing; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  footer { grid-column: 1 / -1; padding: var(--gap) calc(var(--gap) * 1.5) calc(var(--gap) * 1.5); display: grid; grid-template-columns: 1fr auto; gap: var(--gap); align-items: end; border-top: 1px solid var(--line); }
  h1 { margin: 0; font-size: 34px; font-weight: 500; }
  .meta { color: var(--ink-2); font-size: 18px; margin-top: 6px; }
  .note { color: var(--ink-3); font-size: 15px; margin-top: 4px; max-width: 70ch; }
  ul.rules { list-style: none; padding: 0; margin: 14px 0 0; display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--ink-2); font-size: 16px; }
  ul.rules b { color: var(--ink-1); font-weight: 500; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  button { font: inherit; font-size: 15px; color: var(--ink-1); background: none; border: 1px solid var(--ink-3); border-radius: 6px; padding: 9px 16px; cursor: pointer; }
  button:hover { border-color: var(--ink-1); }
  #picked-foot { color: var(--ink-3); font-size: 13px; text-align: right; margin-top: 8px; }
  #status { color: var(--ink-2); font-size: 15px; text-align: right; min-height: 1.2em; margin-top: 8px; }
  .problem { display: grid; place-items: center; height: 100%; color: var(--ink-2); font-size: 20px; padding: 40px; text-align: center; grid-column: 1 / -1; }
  .drop { cursor: pointer; border: 2px dashed var(--ink-3); border-radius: 16px; margin: 24px; height: auto; min-height: 60vh; line-height: 1.5; }
  .drop.over { border-color: var(--ink-1); color: var(--ink-1); }
  .drop small { color: var(--ink-3); font-size: 15px; }

  /* Parts panel: the project view */
  #panel { width: 300px; border-left: 1px solid var(--line); overflow-y: auto; font-size: 14px; color: var(--ink-2); }
  #panel[hidden] { display: none; }
  #panel h2 { margin: 0; padding: 18px 18px 8px; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
  .controls { padding: 0 18px 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
  .seg { display: flex; border: 1px solid var(--ink-3); border-radius: 6px; overflow: hidden; }
  .seg button { flex: 1; border: 0; border-radius: 0; padding: 6px 0; font-size: 13px; color: var(--ink-2); }
  .seg button + button { border-left: 1px solid var(--ink-3); }
  .seg button.on { color: var(--ground); background: var(--ink-1); }
  label.row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  label.row[hidden] { display: none; }
  input[type=range] { width: 100%; accent-color: var(--ink-1); }
  input[type=checkbox] { accent-color: var(--ink-1); }
  .tree { list-style: none; margin: 0; padding: 6px 0 18px; }
  .group > .line, .copy { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 5px 14px 5px 18px; cursor: pointer; }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tail { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .caret { color: var(--ink-3); font-size: 11px; }
  .group > .line:hover, .copy:hover { background: #111; }
  .group > .line { color: var(--ink-1); }
  .copies { list-style: none; margin: 0; padding: 0 0 4px 14px; }
  .copies[hidden] { display: none; }
  .copy { font-size: 13px; }
  .count, .role { color: var(--ink-3); font-size: 12px; }
  .picked { padding: 0 18px 4px; color: var(--ink-3); font-size: 12px; }
  /* The download ticks, drawn here so a part-ticked group's dash shows on the dark ground */
  .tick { touch-action: none; appearance: none; position: relative; width: 13px; height: 13px; margin: 0 4px 0 0; border: 1px solid var(--ink-3); border-radius: 3px; background: none; cursor: pointer; }
  .tick:checked { background: var(--ink-1); border-color: var(--ink-1); }
  .tick:checked::after { content: ""; position: absolute; left: 3.5px; top: 0.5px; width: 3px; height: 7px; border: solid var(--ground); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .tick:indeterminate { border-color: var(--ink-1); }
  .tick:indeterminate::after { content: ""; position: absolute; left: 2px; right: 2px; top: 5px; height: 2px; background: var(--ink-1); }
  .eye { touch-action: none; }
  .eye, .style { background: none; border: 0; padding: 2px 4px; color: var(--ink-2); font-size: 12px; cursor: pointer; }
  .eye { font-size: 13px; width: 20px; }
  .style { width: 44px; text-align: right; }
  .eye.off { color: var(--ink-3); }
  .selected { background: #1a1a1a !important; color: var(--ink-1) !important; }
  /* 2D views (a board's copper, its schematic): tabs over the stage, the drawing panned and zoomed under them */
  .views { position: absolute; top: 14px; left: 14px; z-index: 2; display: grid; gap: 8px; justify-items: start; }
  .views .seg { background: #000; }
  .views .seg[hidden] { display: none; }
  .views .seg button { flex: none; padding: 6px 12px; }
  /* an assembly of several boards has a pair of tabs for each: they wrap rather than run under the Parts button */
  .views .seg { flex-wrap: wrap; }
  .views .seg button { border-bottom: 1px solid var(--ink-3); margin-bottom: -1px; }
  /* Many views, or a phone: one button names the view and opens the list of them, which closes once one is picked */
  #pick { padding: 6px 12px; font-size: 13px; background: #000; }
  #pick[hidden] { display: none; }
  .views.compact #tabs { flex-direction: column; flex-wrap: nowrap; max-height: 60vh; overflow-y: auto; }
  .views.compact #tabs button { text-align: left; border-left: 0; }
  .views.compact:not(.open) #tabs { display: none; }
  /* The version list and print notes: there when wanted, folded away otherwise */
  #about { margin-top: 6px; }
  #about[hidden] { display: none; }
  #about summary { cursor: pointer; color: var(--ink-2); font-size: 14px; width: max-content; }
  #about .meta { font-size: 15px; }
  #jump { padding: 6px 12px; font-size: 13px; background: #000; }
  #jump[hidden] { display: none; }
  #flat { position: absolute; inset: 0; overflow: hidden; background: #000; touch-action: none; cursor: grab; z-index: 1; }
  #flat[hidden] { display: none; }
  #flat img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  #stage.flat canvas { visibility: hidden; }
  .corner { position: absolute; top: 14px; right: 14px; z-index: 2; display: flex; gap: 8px; }
  #toggle, #rulesbtn { padding: 6px 12px; font-size: 13px; background: #000; }
  #toggle[hidden], #rulesbtn[hidden] { display: none; }
  .views { right: 170px; }
  /* The rules sheet: over the model, every value with where it comes from, grouped by object and by rule set */
  #sheet { position: absolute; inset: 0; z-index: 4; background: #000; overflow-y: auto; padding: 14px 18px 40px; }
  #sheet[hidden] { display: none; }
  .sheet-head { position: sticky; top: -14px; background: #000; display: flex; gap: 10px; align-items: center; padding: 6px 0 10px; }
  .sheet-head h2 { margin: 0; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; flex: none; }
  #sheetfind { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--ink-1); background: none; border: 1px solid var(--ink-3); border-radius: 6px; padding: 6px 10px; }
  #sheetclose { padding: 6px 12px; font-size: 13px; }
  .sheet-sub { color: var(--ink-3); font-size: 13px; margin: 0 0 8px; }
  #sheet h3 { font-size: 13px; color: var(--ink-2); font-weight: 500; margin: 18px 0 4px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  #sheet dl { margin: 0; }
  #sheetbody [hidden] { display: none; }
  .rule { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .rule dt { font-size: 15px; overflow-wrap: anywhere; }
  .rule .val { font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rule dd { grid-column: 1 / -1; margin: 0; color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
  .rule .from { color: var(--ink-3); }
  .rule .from a { color: var(--ink-2); }
  .kind { display: inline-block; font-size: 11px; border: 1px solid var(--ink-3); border-radius: 4px; padding: 0 5px; margin-right: 6px; color: var(--ink-2); }
  .kind.estimate { border-color: var(--ink-1); color: var(--ink-1); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding-right: 14px; }
  #close { padding: 4px 10px; font-size: 13px; margin-top: 10px; }
  /* Phones and touch tablets: the panel is a drawer over the model's right side, closed until opened; tap the model
     to close it. Keep this query the same as DRAWER in view.mjs. */
  @media (max-width: 760px), (pointer: coarse) and (max-width: 1100px) {
    body { grid-template-columns: 1fr; }
    #panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 85vw); background: #000; z-index: 5; box-shadow: -12px 0 24px #000; }
    footer { padding: 16px; grid-template-columns: 1fr; gap: 12px; }
    h1 { font-size: 22px; }
    .actions { justify-content: flex-start; }
    #status, #picked-foot { text-align: left; }
  }
</style>
</head>
<body>
<div id="stage"><div class="corner"><button id="rulesbtn" hidden title="Where every measurement comes from">Rules</button><button id="toggle" title="Show or hide the parts panel">Parts</button></div>
  <section id="sheet" hidden aria-label="Rules"><div class="sheet-head"><h2>Rules</h2><input id="sheetfind" type="search" placeholder="Find" aria-label="Find a rule"><button id="sheetclose">Close</button></div><p class="sheet-sub">Every measurement, and where it comes from. Estimates are guesses nobody has checked yet.</p><div id="sheetbody"></div></section>
  <div class="views"><button id="pick" hidden aria-expanded="false" title="Choose a view"></button><div class="seg" id="tabs" hidden></div><div class="seg" id="subtabs" hidden></div><button id="jump" hidden title="Show this board flat, from above">Board view ›</button></div>
  <div id="flat" hidden><img alt="2D view"></div></div>
<aside id="panel" hidden><!-- closed until the script opens it on a wide screen with a mouse -->
  <div class="panel-head"><h2>View</h2><button id="close" title="Hide the parts panel">Close</button></div>
  <div class="controls">
    <div class="seg" id="mode"><button data-mode="solid" class="on">Solid</button><button data-mode="wire">Wireframe</button><button data-mode="xray">X-ray</button></div>
    <label class="row"><span style="width:64px">Explode</span><input type="range" id="explode" min="0" max="1" step="0.01" value="0"></label>
    <label class="row"><input type="checkbox" id="spin" checked> Turn slowly</label>
    <label class="row"><input type="checkbox" id="supports" checked> Show supports</label>
    <label class="row"><input type="checkbox" id="references" checked> Show references</label>
    <button id="reset">Reset view</button>
  </div>
  <h2>Parts</h2>
  <div class="picked" id="picked"></div>
  <ul class="tree" id="tree"></ul>
</aside>
<footer>
  <div><h1 id="title"></h1><details id="about" hidden><summary>Details</summary><div class="meta" id="meta"></div><div class="note" id="note"></div></details><ul class="rules" id="rules"></ul></div>
  <div><div class="actions"><button data-get="stl">Download STL</button><button data-get="3mf">Download 3MF</button><button id="copy">Copy link</button></div><div id="picked-foot"></div><div id="status"></div></div>
</footer>
<script>
  // If the page's script can't run (a stale copy, a blocked request, a bug), say so instead of leaving a black page
  addEventListener('error', (e) => { const s = document.getElementById('status'); if (s && !document.getElementById('title').textContent) s.textContent = `The page didn't load (${e.message || 'a script failed'}). Reload it; if that doesn't help, send this line to Claude.`; }, true);
</script>
<script type="module" src="view.mjs"></script>
</body>
</html>
