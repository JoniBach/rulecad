# The public model page (@rulecad/viewer's site) on GitHub Pages, https://jonibach.github.io/rulecad/, and beside it
# the libraries' documentation, https://jonibach.github.io/rulecad/docs/ (docs/build.mjs: a page per package, its
# README as the reference, live demonstrations). Deployed from main whenever a package or the docs change.
name: pages
on:
  push:
    branches: [main]
    paths: [packages/**, docs/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node packages/viewer/scripts/build.mjs
      - run: node docs/build.mjs --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
