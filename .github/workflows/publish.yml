# On main: publish every package whose version isn't on npm yet (scripts/publish.mjs). To release, merge a release pull
# request made by scripts/release.mjs from the change notes (CONTRIBUTING.md). npm trusts this workflow for each package (trusted publishing), so there are
# no tokens or one-time passwords, and every release carries provenance.
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write # a GitHub Release for each published version
  id-token: write # proves to npm that this workflow, in this repository, is publishing
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    # The whole suite runs again here (66 minutes on 2026-11-27), then the fresh install and the publishing: two hours
    # stops a stuck run without cutting a slow one short. A run stopped part way leaves the rest of the packages to the
    # next run (a rerun, or the next push to main), which publishes whatever is still not on npm.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history and tags, for each release's notes
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11.5 or later for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: test/fresh-install.sh # as a stranger installs them, with no lockfile
      - run: node scripts/publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
