# Every push and pull request: the tests on Linux, macOS and Windows, on the oldest and newest Node rulecad supports.
name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run types # the JSDoc must make valid declarations
  browser:
    # The model page in headless Chrome: drop an STL, check it's drawn, checked and linked. Screenshots are kept.
    # Then the documentation site: every library page runs without a script error and its demonstration draws.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node packages/viewer/scripts/build.mjs
      - run: mkdir -p test/docs-shots && npm run test:browser
        env:
          DOCS_SHOTS: test/docs-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-screenshots
          path: |
            test/viewer*.png
            test/docs-shots/*.png
          if-no-files-found: ignore
  fresh-install:
    # The packages as a stranger installs them: packed, no lockfile, every dependency resolved afresh.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: test/fresh-install.sh
