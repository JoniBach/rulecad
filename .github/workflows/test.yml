# Every pull request and every push to main: the tests on Linux, macOS and Windows, on the oldest and newest Node
# rulecad supports. A branch is tested through its pull request, so each commit runs once (a push to a branch with no
# pull request is not tested). A newer push to a pull request cancels the run it replaces, which then shows as
# cancelled. On main each commit has a group of its own, so its run is neither cancelled nor queued behind the last
# merge's (a shared group would hold one run waiting and drop any older one still waiting).
name: test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: test-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run types # the JSDoc must make valid declarations
  dimension-guards:
    # The fixings migration's guards: screw sizes typed by hand held to the recorded count, and the dimension table's own
    # test. These fail the run when they fail.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: node --test test/fixings-inventory.test.mjs test/dimension-diff.test.mjs
  firmware:
    # The Arduino sketches (every folder with a .ino of its own name) compiled for an Uno, and the streamer for a Mega 2560
    # too: a compile error fails the run. Then the streamer runs on a simulated Uno (avr8js, installed for this job only), homed and fed the worked arm's
    # step file through send.mjs's own lines: every line answered "ok", every step counted against the file, a block past
    # MAX_RATE refused, and the loop's fastest rate, at the cruise, speeding up and slowing down on one to three axes, above
    # MAX_RATE and what the machine description asks. Then the shortest blocks the sender passes are streamed at MAX_RATE on
    # three axes, at the cruise and slowing down every step, each line sent when the last was answered: they must keep to
    # their planned time within 1%, or the streamer falls behind on short blocks. The leg's gait (cad plot leg/stand) is
    # streamed the same way, from its standing pose through three cycles and back, every step counted, and the quadruped's trot
    # (cad plot leg/quadruped) on a simulated Mega 2560, its eight axes, ceilings and short blocks measured there too. Every
    # step of each must come before the drivers go off (test/firmware-disable.test.mjs checks the same, and that each half
    # of that repair, the streamer's d and the sender's wait before it, holds alone). A toolchain download that
    # still fails after three tries is a warning and skips the rest: the compile is what this job is for, not the download.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - id: cli
        continue-on-error: true
        uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db # v2.1.0
        with:
          version: 1.5.1
      - id: toolchain
        if: steps.cli.outcome == 'success'
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            arduino-cli core update-index && arduino-cli core install arduino:avr@1.8.8 && arduino-cli lib install Servo@1.3.0 \
              && npm install --prefix .cache/avr8js --no-audit --no-fund avr8js@0.21.1 && exit 0
            sleep 30
          done
          exit 1
      - if: steps.cli.outcome != 'success' || steps.toolchain.outcome != 'success'
        run: echo "::warning::the Arduino toolchain did not download, so the sketches were not compiled"
      - if: steps.toolchain.outcome == 'success'
        run: npm ci
      - if: steps.toolchain.outcome == 'success'
        working-directory: examples/bench
        run: |
          node ../../packages/cad/bin/cad.mjs machine arm/arm && node ../../packages/cad/bin/cad.mjs plot arm/arm projects/arm/drawings/test.svg
          node ../../packages/cad/bin/cad.mjs machine leg/stand && node ../../packages/cad/bin/cad.mjs plot leg/stand
          node ../../packages/cad/bin/cad.mjs machine leg/quadruped && node ../../packages/cad/bin/cad.mjs plot leg/quadruped
      - if: steps.toolchain.outcome == 'success'
        run: node --test test/firmware-disable.test.mjs
        env:
          AVR8JS: .cache/avr8js/node_modules/avr8js
      - if: steps.toolchain.outcome == 'success'
        run: >-
          node scripts/firmware.mjs --simulate examples/bench/exports/arm/arm-test.steps.json --machine examples/bench/exports/arm/arm.machine.json
          --simulate examples/bench/exports/leg/stand-gait.steps.json --machine examples/bench/exports/leg/stand.machine.json
          --simulate examples/bench/exports/leg/quadruped-gait.steps.json --machine examples/bench/exports/leg/quadruped.machine.json
        env:
          AVR8JS: .cache/avr8js/node_modules/avr8js
  dimensions:
    # Every example object's drawn sizes compared with the commit this one follows (a pull request: its base), the table
    # in the run's summary. Measures are kept between runs by what each object is built from, so only what a change
    # touches is built. The table is for reading: this job never fails the run, even when its runner is lost (a change
    # to the kit itself rebuilds every example cold, the showcase's optimisations and an autorouted board among them).
    runs-on: ubuntu-latest
    timeout-minutes: 55
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/dimension-diff
          key: dimension-diff-${{ github.sha }}
          restore-keys: dimension-diff-
      # One build at a time, each Node process's heap held to 6 GB of the runner's 16: with two at once the runner was
      # lost three times on 2026-11-17 (a shutdown signal about 13 minutes in), most likely out of memory. The heap cap
      # does not hold an optimisation's or a lamina's arrays and WASM memory, so the script itself keeps those apart: their
      # results are shared by both commits and kept in the cache above (.cache/dimension-diff/slow/), and a worker past
      # DIMENSION_DIFF_RSS_MB after a build hands the rest of its list to a fresh one. A build past the cap stops with a
      # heap error that the table shows against its objects. One build that grows past DIMENSION_DIFF_LIMIT_MB (all its
      # memory, WASM included, read every 0.2 s while it runs) is stopped there and shown as not measured, so the runner
      # keeps its memory and the cache its results; a run that outlasts its time is green, and saves what it built.
      - run: node scripts/dimension-diff.mjs ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }} HEAD --md --jobs 1 >> "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 25
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          DIMENSION_DIFF_LIMIT_MB: 8192
  browser:
    # The model page in headless Chrome: drop an STL, check it's drawn, checked and linked. Screenshots are kept.
    # Then the documentation site: every library page runs without a script error and its demonstration draws.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: node packages/viewer/scripts/build.mjs
      - run: mkdir -p test/docs-shots && npm run test:browser
        env:
          DOCS_SHOTS: test/docs-shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: viewer-screenshots
          path: |
            test/viewer*.png
            test/docs-shots/*.png
          if-no-files-found: ignore
  fresh-install:
    # The packages as a stranger installs them: packed, no lockfile, every dependency resolved afresh.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: test/fresh-install.sh
